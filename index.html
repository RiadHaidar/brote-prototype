<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Brote Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
/* Single deliberate light look: warm cream app on a sand backdrop (matches the project deck). */
:root {
  --cream: #FBF7F0;
  --paper: #FFFDF9;
  --sand: #F3EBDD;
  --line: #E7DECF;
  --ink: #1D2B3A;
  --ink2: #4F5D6C;
  --ink3: #7A8593;
  --orange: #C2410C;
  --orange-soft: #FBE6D8;
  --teal: #0F766E;
  --teal-soft: #DCEFEA;
  --leaf: #3C8C5A;
  --leaf2: #62AE6F;
  --wilt: #A8874E;
  --wilt2: #C9AC72;
  --clay: #C9855D;
  --clay2: #AE6A44;
  --sun: #F0B23C;
  --petal: #E46F4E;
  --good: #0F766E;
  --bad: #C2410C;
  --backdrop: #EDE5D7;
  --r: 18px;
  --shadow: 0 1px 0 rgba(29, 43, 58, .04), 0 6px 18px -8px rgba(29, 43, 58, .18);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
#root { height: 100%; }
body {
  background: var(--backdrop);
  color: var(--ink);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--teal); }
a:hover { color: var(--orange); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, .fred { font-family: 'Fredoka', 'Nunito Sans', sans-serif; font-weight: 600; letter-spacing: -.01em; margin: 0; }
p { margin: 0; text-wrap: pretty; }

/* ---------- Stage: guide + phone ---------- */
.stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 32px 24px; }
.guide { width: 280px; display: flex; flex-direction: column; gap: 18px; max-height: calc(100vh - 64px); overflow-y: auto; scrollbar-width: thin; padding-right: 6px; }
@media (min-width: 761px) and (max-height: 930px) { .phone { zoom: .9; } }
@media (min-width: 761px) and (max-height: 830px) { .phone { zoom: .8; } }
@media (min-width: 761px) and (max-height: 740px) { .phone { zoom: .7; } }
.guide h1 { font-size: 30px; display: flex; align-items: center; gap: 10px; }
.guide .lead { color: var(--ink2); font-size: 14px; line-height: 1.5; }
.guide-group { display: flex; flex-direction: column; gap: 4px; }
.guide-group h4 { margin: 6px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); font-weight: 800; }
.guide-link { text-align: left; font-size: 14px; padding: 7px 10px; border-radius: 10px; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.guide-link:hover { background: rgba(255, 255, 255, .6); }
.guide-link.on { background: var(--paper); box-shadow: var(--shadow); font-weight: 700; }
.guide-link small { color: var(--ink3); font-weight: 600; }
.seg { display: flex; background: rgba(255, 255, 255, .55); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--ink2); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.guide .note { font-size: 12px; color: var(--ink3); line-height: 1.5; }

.phone {
  width: 390px; height: 844px; flex: none;
  border-radius: 54px; background: var(--ink); padding: 11px;
  box-shadow: 0 30px 60px -20px rgba(29, 43, 58, .45), inset 0 0 0 2px #2c3d50;
}
.screen {
  position: relative; width: 100%; height: 100%; border-radius: 44px; overflow: hidden;
  background: var(--cream); display: flex; flex-direction: column;
}
.statusbar { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; font-size: 14px; font-weight: 800; }
.statusbar .notch { width: 96px; height: 26px; border-radius: 20px; background: var(--ink); }
.statusbar .sys { display: flex; gap: 5px; align-items: center; }
.statusbar .sys i { display: block; width: 16px; height: 9px; border-radius: 3px; border: 2px solid var(--ink); }
.statusbar .sys b { display: block; width: 4px; height: 9px; border-radius: 1px; background: var(--ink); }

@media (max-width: 760px) {
  .guide { display: none; }
  .stage { padding: 0; }
  .stage { min-height: 0; height: 100%; }
  .phone { width: 100%; height: 100%; border-radius: 0; padding: 0; box-shadow: none; }
  .screen { border-radius: 0; }
}

/* ---------- Generic screen bits ---------- */
.body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 20px 24px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.card { background: var(--paper); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; }
.muted { color: var(--ink2); }
.tiny { font-size: 12px; }
.sm { font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 16px; font-weight: 800; font-size: 16px; transition: transform .12s ease, box-shadow .12s ease; }
.btn:active { transform: translateY(2px); }
.btn.primary { background: var(--orange); color: #fff; box-shadow: 0 4px 0 #8f2f08; }
.btn.primary:active { box-shadow: 0 2px 0 #8f2f08; }
.btn.teal { background: var(--teal); color: #fff; box-shadow: 0 4px 0 #0a524c; }
.btn.ghost { background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1.5px var(--line) inset; }
.btn.small { min-height: 40px; font-size: 14px; padding: 0 14px; border-radius: 12px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link { font-weight: 700; color: var(--teal); font-size: 14px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--paper); box-shadow: var(--shadow); }
.flame { width: 12px; height: 15px; background: var(--orange); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; position: relative; }
.flame::after { content: ''; position: absolute; left: 3px; bottom: 2px; width: 6px; height: 7px; border-radius: 50%; background: var(--sun); }
.frost { width: 13px; height: 13px; border-radius: 3px; background: #8EC5D6; transform: rotate(45deg); box-shadow: inset 0 0 0 3px #CBE7EF; }

.topbar { display: flex; align-items: center; gap: 10px; padding: 4px 20px 8px; min-height: 48px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--paper); box-shadow: var(--shadow); font-weight: 800; font-size: 18px; flex: none; }
.x::before, .x::after { content: ''; position: absolute; width: 16px; height: 2.5px; border-radius: 2px; background: var(--ink); }
.x { position: relative; }
.x::before { transform: rotate(45deg); }
.x::after { transform: rotate(-45deg); }
.back::before { content: ''; width: 10px; height: 10px; border-left: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); transform: translateX(2px) rotate(45deg); }

/* ---------- Tab bar ---------- */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 8px 10px 22px; background: var(--paper); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 800; color: var(--ink3); padding: 6px 0; }
.tab.on { color: var(--ink); }
.tab .ti { width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center; }
.tab.on .ti { background: var(--orange-soft); }
.ti-garden { width: 12px; height: 14px; background: currentColor; border-radius: 0 100% 0 100%; transform: rotate(-45deg); }
.ti-play { width: 0; height: 0; border-left: 12px solid currentColor; border-top: 8px solid transparent; border-bottom: 8px solid transparent; margin-left: 3px; }
.ti-journey { width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 3px solid currentColor; }
.ti-friends { width: 23px; height: 12px; position: relative; }
.ti-friends::before, .ti-friends::after { content: ''; position: absolute; top: 0; width: 11px; height: 11px; border-radius: 50%; border: 2.5px solid currentColor; }
.ti-friends::before { left: 0; } .ti-friends::after { right: 0; }
.tab.on .ti-garden, .tab.on .ti-play { color: var(--orange); }

/* ---------- Plants ---------- */
.plant { position: relative; width: 56px; height: 66px; flex: none; transform-origin: bottom center; }
.plant .pot { position: absolute; bottom: 0; left: 50%; width: 26px; height: 15px; transform: translateX(-50%); background: var(--clay); border-radius: 2px 2px 8px 8px; }
.plant .pot::before { content: ''; position: absolute; top: -4px; left: -3px; right: -3px; height: 6px; border-radius: 3px; background: var(--clay2); }
.plant .stem { position: absolute; bottom: 14px; left: calc(50% - 1.5px); width: 3px; border-radius: 3px; background: var(--leaf); transform-origin: bottom center; transition: transform .8s cubic-bezier(.3, 1.6, .5, 1), height .6s ease, background .6s; }
.plant .leaf { position: absolute; width: 15px; height: 9px; background: var(--leaf2); border-radius: 0 100% 0 100%; transition: transform .8s cubic-bezier(.3, 1.6, .5, 1), background .6s; }
.plant .leaf.l { right: 1px; bottom: 30%; transform-origin: right bottom; transform: rotate(-12deg) scaleX(-1); border-radius: 100% 0 100% 0; }
.plant .leaf.r { left: 1px; bottom: 48%; transform-origin: left bottom; transform: rotate(-22deg); }
.plant .leaf.l2 { right: 1px; bottom: 70%; transform-origin: right bottom; transform: rotate(-30deg) scaleX(-1) scale(.8); border-radius: 100% 0 100% 0; }
.plant .flower { position: absolute; top: -5px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--sun); box-shadow: 0 -6px 0 0 var(--fc, var(--petal)), 6px -1px 0 0 var(--fc, var(--petal)), 4px 5px 0 0 var(--fc, var(--petal)), -4px 5px 0 0 var(--fc, var(--petal)), -6px -1px 0 0 var(--fc, var(--petal)); }
.plant .bud { position: absolute; top: -4px; left: 50%; width: 7px; height: 9px; margin-left: -3.5px; border-radius: 50% 50% 45% 45%; background: var(--wilt2); }
.plant.sprout .stem { height: 16px; }
.plant.sprout .leaf.r, .plant.sprout .leaf.l2 { display: none; }
.plant.sprout .leaf.l { bottom: 45%; }
.plant.leafy .stem { height: 28px; }
.plant.leafy .leaf.l2 { display: none; }
.plant.bloom .stem { height: 34px; }
.plant.wilt .stem { height: 24px; background: var(--wilt); transform: rotate(24deg); }
.plant.wilt .leaf { background: var(--wilt2); }
.plant.wilt .leaf.l { transform: rotate(40deg) scaleX(-1); }
.plant.wilt .leaf.r { transform: rotate(48deg); }
.plant.wilt .leaf.l2 { display: none; }
.plant.wilt .pot { background: #C49A7F; }
.plant.glow { animation: revive 1.4s cubic-bezier(.3, 1.6, .5, 1) both; }
.plant.glow::after { content: ''; position: absolute; left: 50%; top: 46%; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: radial-gradient(circle, rgba(240, 178, 60, .45), rgba(240, 178, 60, 0) 70%); animation: halo 2.4s ease-out both; pointer-events: none; z-index: -1; }
@keyframes revive { 0% { transform: scale(.7); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes halo { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.4); } }

/* garden */
.bed { padding: 14px 12px 10px; }
.bed-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px 6px; }
.bed-head h3 { font-size: 17px; }
.bed-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); row-gap: 6px; position: relative; }
.bed-grid::before { content: ''; position: absolute; left: 4px; right: 4px; bottom: 26px; height: 10px; border-radius: 6px; background: var(--sand); }
.pcell { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0; border-radius: 12px; position: relative; }
.pcell:hover { background: rgba(243, 235, 221, .5); }
.pcell .plant { transform: scale(1.05); margin: 4px 0 -2px; }
.pcell .wlabel { font-size: 10px; font-weight: 800; color: var(--ink2); white-space: nowrap; letter-spacing: -.01em; }
.pcell.danger .wlabel { color: var(--orange); }

.goalring { width: 64px; height: 64px; position: relative; flex: none; }
.goalring svg { transform: rotate(-90deg); }
.goalring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: 'Fredoka'; font-weight: 600; font-size: 16px; }

.danger-card { display: flex; align-items: center; gap: 12px; background: var(--orange-soft); border-radius: var(--r); padding: 12px 14px; text-align: left; width: 100%; }
.danger-card .mini { display: flex; margin-right: -4px; }
.danger-card .mini .plant { transform: scale(.75); margin: -8px -10px -4px; }

/* bottom sheet */
.scrim { position: absolute; inset: 0; background: rgba(29, 43, 58, .35); z-index: 70; animation: fade .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 71; background: var(--paper); border-radius: 26px 26px 0 0; padding: 10px 22px 30px; display: flex; flex-direction: column; gap: 14px; animation: up .28s cubic-bezier(.2, .9, .3, 1) both; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 4px; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.bar { height: 10px; border-radius: 6px; background: var(--sand); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; background: var(--teal); transition: width .5s ease; }

.toast { position: absolute; left: 20px; right: 20px; bottom: 100px; z-index: 90; background: var(--ink); color: #fff; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; animation: up .25s ease both; text-align: center; }

/* ---------- Onboarding ---------- */
.onb { flex: 1; display: flex; flex-direction: column; padding: 8px 24px 28px; gap: 18px; overflow-y: auto; }
.brandmark { display: flex; align-items: flex-end; gap: 6px; }
.brandmark .word { font-family: 'Fredoka'; font-weight: 700; font-size: 40px; line-height: 1; letter-spacing: -.02em; }
.dir-card { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); text-align: left; width: 100%; transition: transform .15s; }
.dir-card:hover { transform: translateY(-2px); }
.dir-card .flag { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-family: 'Fredoka'; font-weight: 700; font-size: 16px; flex: none; }
.dir-card .flag.en { background: var(--teal-soft); color: var(--teal); }
.dir-card .flag.es { background: var(--orange-soft); color: var(--orange); }
.dir-card h3 { font-size: 19px; }
.arrow-r { width: 10px; height: 10px; border-right: 2.5px solid var(--ink3); border-top: 2.5px solid var(--ink3); transform: rotate(45deg); flex: none; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 6px; border-radius: 4px; background: var(--line); }
.steps i.on { background: var(--orange); }
.pchips { display: flex; flex-wrap: wrap; gap: 10px; }
.pchip { padding: 12px 16px; border-radius: 14px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--line) inset; font-weight: 800; font-size: 15px; transition: all .15s; }
.pchip.on { background: var(--teal); color: #fff; box-shadow: 0 0 0 1.5px var(--teal) inset; }
.goal-opt { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--line) inset; text-align: left; width: 100%; }
.goal-opt.on { box-shadow: 0 0 0 2.5px var(--orange) inset; background: #FFF8F2; }
.goal-opt .dots { display: flex; gap: 3px; align-items: flex-end; width: 34px; }
.goal-opt .dots i { width: 8px; border-radius: 3px; background: var(--line); }
.goal-opt.on .dots i.f { background: var(--orange); }
.goal-opt .dots i.f { background: var(--ink3); }
.result-note { background: var(--teal-soft); color: #0b4f49; border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 14px; animation: up .25s ease both; }

/* ---------- Games ---------- */
.game-card { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); background: var(--paper); box-shadow: var(--shadow); text-align: left; width: 100%; transition: transform .15s; }
.game-card:hover { transform: translateY(-2px); }
.gicon { width: 54px; height: 54px; border-radius: 16px; flex: none; position: relative; display: grid; place-items: center; }
.gicon.memory { background: var(--orange-soft); }
.gicon.memory::before, .gicon.memory::after { content: ''; position: absolute; width: 18px; height: 24px; border-radius: 5px; background: var(--orange); }
.gicon.memory::before { transform: translate(-6px, 2px) rotate(-10deg); opacity: .55; }
.gicon.memory::after { transform: translate(6px, -2px) rotate(8deg); }
.gicon.sort { background: var(--teal-soft); }
.gicon.sort::before { content: ''; width: 28px; height: 22px; border: 3px solid var(--teal); border-top: 0; border-radius: 0 0 8px 8px; position: absolute; bottom: 12px; }
.gicon.sort::after { content: ''; width: 12px; height: 12px; border-radius: 3px; background: var(--teal); position: absolute; top: 10px; transform: rotate(15deg); }
.gicon.listen { background: #F7EEDB; }
.gicon.listen::before { content: ''; width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--sun); border-left-color: transparent; border-bottom-color: transparent; transform: rotate(45deg); position: absolute; left: 20px; }
.gicon.listen::after { content: ''; width: 10px; height: 14px; background: #B7821A; border-radius: 3px; position: absolute; left: 13px; }
.gicon.rorw { background: #E9E6F3; }
.gicon.rorw::before { content: ''; width: 22px; height: 28px; border-radius: 6px; background: #5B5592; transform: rotate(-12deg); }
.gicon.locked { background: var(--sand); }
.gicon.locked::before { content: ''; width: 16px; height: 12px; border-radius: 3px; background: var(--ink3); position: absolute; bottom: 15px; }
.gicon.locked::after { content: ''; width: 10px; height: 10px; border: 3px solid var(--ink3); border-bottom: 0; border-radius: 8px 8px 0 0; position: absolute; top: 14px; }
.soon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.soon { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: rgba(255, 253, 249, .6); box-shadow: 0 0 0 1.5px var(--line) inset; color: var(--ink2); font-weight: 800; font-size: 13px; }
.soon .gicon { width: 34px; height: 34px; border-radius: 10px; transform: scale(.9); }
.soon .gicon.locked::before { width: 12px; height: 9px; bottom: 9px; }
.soon .gicon.locked::after { width: 8px; height: 7px; border-width: 2.5px; top: 8px; }

.ghead { display: flex; align-items: center; gap: 10px; padding: 4px 20px 6px; }
.ghead .title { font-family: 'Fredoka'; font-weight: 600; font-size: 18px; flex: 1; }
.gmeta { display: flex; align-items: center; gap: 10px; padding: 0 20px 6px; }
.timebar { flex: 1; height: 10px; border-radius: 6px; background: var(--sand); overflow: hidden; }
.timebar > i { display: block; height: 100%; background: var(--teal); border-radius: 6px; transition: width 1s linear, background .3s; }
.timebar.low > i { background: var(--orange); }
.pts { font-family: 'Fredoka'; font-weight: 600; font-size: 15px; min-width: 56px; text-align: right; }
.combo { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--sand); color: var(--ink2); transition: background .2s, color .2s; }
.combo b { font-family: 'Fredoka'; font-weight: 600; font-size: 15px; }
.combo.hot { background: var(--orange); color: #fff; }
.combo.pop { animation: pop .35s cubic-bezier(.3, 1.8, .5, 1); }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
.floatpts { position: absolute; font-family: 'Fredoka'; font-weight: 700; color: var(--orange); font-size: 22px; pointer-events: none; animation: floatup .8s ease-out both; z-index: 30; }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }
.hint { text-align: center; font-size: 13px; color: var(--ink2); font-weight: 700; }

/* memory */
.mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: 1; align-content: center; }
.mcard { perspective: 700px; height: 112px; }
.mcard .inner { position: relative; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.3, 1.3, .5, 1); transform-style: preserve-3d; }
.mcard.open .inner, .mcard.done .inner { transform: rotateY(180deg); }
.mcard .face { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; display: grid; place-items: center; padding: 8px; text-align: center; font-weight: 800; font-size: 15px; line-height: 1.15; }
.mcard .back { background: var(--ink); box-shadow: 0 4px 0 #0f1823; }
.mcard .back::before { content: ''; width: 18px; height: 22px; background: #2F4459; border-radius: 0 100% 0 100%; transform: rotate(-45deg); }
.mcard .front { transform: rotateY(180deg); background: var(--paper); box-shadow: 0 4px 0 var(--line), 0 0 0 1.5px var(--line) inset; }
.mcard .front.t { color: var(--orange); }
.mcard .front.n { color: var(--teal); }

.mcard.bad .front { background: var(--orange-soft); }

.sort-area { flex: 1; display: flex; flex-direction: column; gap: 16px; position: relative; }
.sort-stage { flex: 1; display: grid; place-items: center; position: relative; }

.sort-card.dragging { transition: none; cursor: grabbing; box-shadow: 0 16px 30px -10px rgba(29, 43, 58, .35); }
.sort-card.enter { animation: cardin .25s cubic-bezier(.3, 1.5, .5, 1) both; }
.sort-card.shake { animation: shake .35s ease; }
@keyframes cardin { from { transform: scale(.7); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-10px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-5px); } }
.bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bin { height: 120px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 12px 6px; gap: 6px; font-weight: 800; font-size: 14px; border: 2.5px dashed transparent; transition: transform .15s, border-color .15s; position: relative; }
.bin.food { background: var(--orange-soft); color: #8a2e08; }
.bin.travel { background: var(--teal-soft); color: #0b4f49; }
.bin.home { background: #EEE7F6; color: #4b3f7a; }
.bin.over { transform: scale(1.05); border-color: currentColor; }
.bin.flash-ok { animation: binok .45s ease; }
@keyframes binok { 50% { transform: scale(1.1); } }
.bin .count { font-family: 'Fredoka'; font-size: 26px; font-weight: 600; }

/* listen */
.listen-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.playbtn { width: 132px; height: 132px; border-radius: 50%; background: var(--orange); box-shadow: 0 6px 0 #8f2f08; display: grid; place-items: center; position: relative; }
.playbtn::before { content: ''; border-left: 34px solid #fff; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 10px; }
.playbtn.playing::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 4px solid var(--orange); opacity: .5; animation: ring 1s ease-out infinite; }
@keyframes ring { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.opt { min-height: 64px; border-radius: 16px; background: var(--paper); box-shadow: 0 4px 0 var(--line), 0 0 0 1.5px var(--line) inset; font-weight: 800; font-size: 17px; padding: 8px; transition: transform .1s; }
.opt:active { transform: translateY(2px); }
.opt.ok { background: var(--teal); color: #fff; box-shadow: 0 4px 0 #0a524c; }
.opt.no { background: var(--orange-soft); color: var(--orange); box-shadow: 0 4px 0 #f0c9b0; }
.opts.one { grid-template-columns: 1fr; }

/* right or wrong */
.rw-stage { flex: 1; position: relative; display: grid; place-items: center; }
.rw-card { width: 270px; height: 300px; border-radius: 26px; background: var(--paper); box-shadow: 0 8px 0 var(--line), var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; touch-action: none; user-select: none; cursor: grab; position: absolute; transition: transform .25s ease; padding: 20px; text-align: center; }
.rw-card.back2 { transform: translateY(14px) scale(.94); opacity: .6; pointer-events: none; }
.rw-card.dragging { transition: none; }
.rw-card .tw { font-family: 'Fredoka'; font-weight: 600; font-size: 32px; color: var(--orange); }
.rw-card .eq { width: 28px; height: 10px; border-top: 3px solid var(--ink3); border-bottom: 3px solid var(--ink3); }
.rw-card .nw { font-family: 'Fredoka'; font-weight: 600; font-size: 28px; color: var(--teal); }
.rw-stamp { position: absolute; top: 18px; padding: 4px 10px; border-radius: 8px; border: 3px solid; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; opacity: 0; }
.rw-stamp.r { right: 18px; color: var(--teal); transform: rotate(10deg); }
.rw-stamp.w { left: 18px; color: var(--orange); transform: rotate(-10deg); }
.rw-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rw-btns .btn { min-height: 60px; }
.rw-feedback { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 15px; }

/* rescue */
.rescue-plants { display: flex; justify-content: center; gap: 2px; padding: 4px 0 2px; }
.rescue-plants .plant { transform: scale(1); margin: 0 2px; }
.prompt-big { font-family: 'Fredoka'; font-weight: 600; font-size: 34px; text-align: center; }

/* summary */
.sum-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 8px; }
.sum-hero .plants { display: flex; justify-content: center; align-items: flex-end; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--paper); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
.stat b { font-family: 'Fredoka'; font-weight: 600; font-size: 26px; display: block; }
.grew { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.grew:last-child { border-bottom: 0; }
.grew .plant { transform: scale(.72); margin: -10px -9px -6px; }
.grew .to { width: 14px; height: 2px; background: var(--ink3); position: relative; }
.grew .to::after { content: ''; position: absolute; right: -1px; top: -3px; width: 6px; height: 6px; border-right: 2px solid var(--ink3); border-top: 2px solid var(--ink3); transform: rotate(45deg); }
.adslot { border-radius: 16px; border: 1.5px dashed var(--ink3); padding: 12px 14px; display: flex; gap: 12px; align-items: center; background: rgba(255, 253, 249, .5); }
.adslot .tag { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 3px 6px; border-radius: 5px; background: var(--ink); color: #fff; flex: none; }

.striped { background: repeating-linear-gradient(-45deg, #e9e1d3 0 10px, #f3ece0 10px 20px); display: grid; place-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--ink2); border-radius: 16px; }

.wotd { border-radius: 26px; padding: 22px; color: var(--ink); background: var(--orange-soft); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.wotd .big { font-family: 'Fredoka'; font-weight: 700; font-size: 44px; color: var(--orange); line-height: 1; }
.wotd .tr { font-family: 'Fredoka'; font-weight: 600; font-size: 22px; color: var(--teal); }

.jnode-row { height: 92px; position: relative; }
.jnode { display: flex; flex-direction: column; align-items: center; gap: 6px; position: absolute; top: 0; width: 120px; margin-left: -60px; z-index: 1; }
.jdot { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; font-family: 'Fredoka'; font-weight: 700; font-size: 20px; }
.jnode.done .jdot { background: var(--teal); color: #fff; box-shadow: 0 5px 0 #0a524c; }

.jnode.locked .jdot { background: var(--sand); color: var(--ink3); box-shadow: 0 5px 0 var(--line); }
.jnode .jl { font-weight: 800; font-size: 13px; text-align: center; }
.jnode.locked .jl { color: var(--ink3); }
@keyframes breathe { 50% { box-shadow: 0 5px 0 #8f2f08, 0 0 0 12px rgba(194, 65, 12, .08); } }
.jpath { position: absolute; left: 0; width: 100%; pointer-events: none; overflow: visible; }
